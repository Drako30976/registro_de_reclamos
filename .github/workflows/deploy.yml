name: Despliegue Automático en PC Laboral

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Actualizar y Reconstruir App
    runs-on: self-hosted

    steps:
      - name: Actualizar repositorio y reiniciar contenedor
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Iniciando despliegue en PC Laboral..."
          Write-Host "=========================================="
          
          $ExtraPaths = @(
            "C:\Program Files\Git\cmd",
            "C:\Program Files\Git\bin",
            "C:\Program Files (x86)\Git\cmd",
            "C:\Users\msoto\AppData\Local\Programs\Git\cmd",
            "C:\Program Files\Docker\Docker\resources\bin",
            "C:\ProgramData\DockerDesktop\version-bin"
          )
          foreach ($p in $ExtraPaths) {
            if (Test-Path $p) {
              $env:PATH = "$p;$env:PATH"
            }
          }

          $PathsToTest = @(
            "C:\Users\msoto\Desktop\Programacion\gestion de reclamo\registro_de_reclamos",
            "$HOME\Desktop\Proyecto\registro_de_reclamos",
            "C:\Users\Mauro\Desktop\Proyecto\registro_de_reclamos",
            "C:\Proyecto\registro_de_reclamos"
          )
          $ProjectDir = $null
          foreach ($p in $PathsToTest) {
            if (Test-Path $p) {
              $ProjectDir = $p
              break
            }
          }
          if (-not $ProjectDir) {
            $found = Get-ChildItem -Path "C:\Users" -Filter "registro_de_reclamos" -Recurse -Depth 5 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $ProjectDir = $found.FullName
            }
          }
          if (-not $ProjectDir) {
            throw "No se encontro la carpeta del proyecto registro_de_reclamos en el equipo."
          }
          
          Write-Host "Directorio del proyecto detectado: $ProjectDir"
          Set-Location -Path $ProjectDir

          git config --global --add safe.directory "*"

          Write-Host "Descargando últimos cambios de GitHub..."
          git fetch origin main
          git reset --hard origin/main

          Write-Host "Reconstruyendo contenedor de la aplicación..."
          docker compose up -d --build app

          Write-Host "=========================================="
          Write-Host "¡Despliegue completado con éxito!"
          Write-Host "=========================================="
